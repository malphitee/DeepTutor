name: Docker Images

# Build each architecture once and publish the same image to both registries.
# Version-tag pushes from main publish production images.
# Only stable version tags update latest. This fork owns both destinations below.
#
# GHCR: ghcr.io/malphitee/deeptutor
# CNB:  docker.cnb.cool/johnnliu/deeptutor

on:
  push:
    tags:
      - 'v*'

# Serialize different production tags so aliases are advanced in order.
concurrency:
  group: docker-images-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/malphitee/deeptutor
  CNB_IMAGE: docker.cnb.cool/johnnliu/deeptutor
  RELEASE_BRANCH: main
  DOCKER_METADATA_SHORT_SHA_LENGTH: "12"

jobs:
  validate-release-tag:
    name: Validate publication event
    if: github.repository == 'malphitee/DeepTutor' && github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.validate.outputs.image_tag }}
      is_stable: ${{ steps.validate.outputs.is_stable }}
      channel: ${{ steps.validate.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version tag is contained in main
        shell: bash
        env:
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |
          git fetch --no-tags origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::Version tags must point to a commit already contained in $RELEASE_BRANCH."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install version parser
        run: python -m pip install packaging==25.0

      - name: Validate version-tag push
        id: validate
        run: python scripts/validate_image_release.py
        env:
          REF_DELETED: ${{ github.event.deleted }}

  build-and-push:
    name: Build ${{ needs.validate-release-tag.outputs.channel }} (${{ matrix.arch }})
    needs: validate-release-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CNB credentials are configured
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "::error::Set the repository Actions secret CNB_TOKEN before publishing."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The validated version drops the leading 'v'. Pre-releases retain a
      # versioned image but never replace the stable 'latest' tag.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.CNB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate-release-tag.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.validate-release-tag.outputs.channel == 'production' && needs.validate-release-tag.outputs.is_stable == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          # CNB rejected the generated attestation manifests as UNKNOWN.
          # Publish ordinary image manifests until that format is validated.
          provenance: false
          sbom: false
          # No public tags until both architectures have reached both registries.
          outputs: type=image,"name=${{ env.GHCR_IMAGE }},${{ env.CNB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # Import the shared production cache; keep the old GHA cache as a
          # fallback while registry caches warm up.
          cache-from: |
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-production-${{ matrix.arch }}
            type=gha,scope=deeptutor-${{ matrix.arch }}
          # mode=max includes the npm and Python builder stages, not only the
          # final runtime image. Cache export is best-effort; publishing the
          # actual images is not.
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-production-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Record published digest
        shell: python
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
          DIGEST_DIR: ${{ runner.temp }}/image-digests
        run: |
          import os
          from pathlib import Path
          import re

          digest = os.environ["IMAGE_DIGEST"]
          arch = os.environ["IMAGE_ARCH"]
          if arch not in {"amd64", "arm64"} or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Build did not produce a valid platform digest")
          directory = Path(os.environ["DIGEST_DIR"])
          directory.mkdir(parents=True, exist_ok=True)
          (directory / f"{arch}.digest").write_text(digest + "\n", encoding="utf-8")

      - name: Upload platform digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digests/${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish-manifest:
    name: Publish and verify both registries
    needs: [validate-release-tag, build-and-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digests-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.CNB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate-release-tag.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.validate-release-tag.outputs.channel == 'production' && needs.validate-release-tag.outputs.is_stable == 'true' }}

      - name: Publish and verify manifests
        id: publish
        run: python scripts/publish_image_manifests.py
        env:
          DIGEST_DIR: ${{ runner.temp }}/image-digests
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          PUBLICATION_CHANNEL: ${{ needs.validate-release-tag.outputs.channel }}
          IMAGE_TAG: ${{ needs.validate-release-tag.outputs.image_tag }}
