name: Docker Release

# Build once and publish the same multi-platform image to both registries.
# Push/manual branch builds use branch + commit tags; only stable releases
# update latest. This fork owns both destinations below.
#
# GHCR: ghcr.io/malphitee/deeptutor
# CNB:  docker.cnb.cool/johnnliu/deeptutor

on:
  push:
    branches:
      - main
      - feature/user-isolation
  workflow_dispatch:
  release:
    types: [published]

# Serialize runs on a ref so an older build cannot overwrite its newer tag.
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/malphitee/deeptutor
  CNB_IMAGE: docker.cnb.cool/johnnliu/deeptutor
  DOCKER_METADATA_SHORT_SHA_LENGTH: "12"

jobs:
  validate-release-tag:
    name: Validate publication event
    if: github.repository == 'malphitee/DeepTutor' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.validate.outputs.image_tag }}
      is_stable: ${{ steps.validate.outputs.is_stable }}
    steps:
      - name: Require an image version tag
        id: validate
        shell: python
        run: |
          import os
          import re

          if os.environ.get("GITHUB_EVENT_NAME", "release") != "release":
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("image_tag=\nis_stable=false\n")
              raise SystemExit(0)

          tag = os.environ["RELEASE_TAG"]
          pattern = (
              r"^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:(?:a|b|rc)(?:0|[1-9]\d*))?"
              r"(?:\.post(?:0|[1-9]\d*))?"
              r"(?:\.dev(?:0|[1-9]\d*))?"
              r"(?:\+[0-9A-Za-z]+(?:[._-][0-9A-Za-z]+)*)?$"
          )
          if not re.fullmatch(pattern, tag):
              raise SystemExit(
                  f"Release tag {tag!r} is not an image version tag "
                  "(expected vX.Y.Z with an optional suffix)."
              )
          # '+' is valid version metadata but not valid in an OCI tag.
          image_tag = tag[1:].replace("+", "-")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image_tag={image_tag}\n")
              output.write(
                  "is_stable="
                  + str(bool(re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag))).lower()
                  + "\n"
              )
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  build-and-push:
    name: Build and Push Multi-Platform Docker Image
    needs: validate-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CNB credentials are configured
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "::error::Set the repository Actions secret CNB_TOKEN before publishing."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      # Required for linux/arm64 cross-compilation on GitHub-hosted ubuntu runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Enable BuildKit with multi-platform build support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The validated version drops the leading 'v'. Pre-releases retain a
      # versioned image but never replace the stable 'latest' tag.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.CNB_IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'release' }}
            type=sha,format=short
            type=raw,value=${{ needs.validate-release-tag.outputs.image_tag }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false && needs.validate-release-tag.outputs.is_stable == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up repeated builds
          # mode=max caches all intermediate layers (frontend-builder and python-base are expensive)
          cache-from: type=gha
          cache-to: type=gha,mode=max
