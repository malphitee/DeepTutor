name: User Isolation

# No path filter: Compose-only changes must be checked too, and a required PR
# check must always report a result. Docker publication calls this same gate.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  isolation:
    name: User isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      DEEPTUTOR_HOME: ${{ runner.temp }}/deeptutor-isolation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt -r requirements/partners.txt pytest pytest-asyncio

      - name: Create isolated runtime config
        run: |
          mkdir -p "$DEEPTUTOR_HOME/data/user/settings"
          cp tests/fixtures/ci_model_catalog.json "$DEEPTUTOR_HOME/data/user/settings/model_catalog.json"
          cat > "$DEEPTUTOR_HOME/data/user/settings/main.yaml" <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML

      - name: Check account and workspace boundaries
        run: |
          python -m pytest -q tests/multi_user tests/services/workspace tests/app/test_turn_scope_ownership.py tests/api/test_invite_registration.py tests/test_release_workflow_guards.py
